<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTLdabs Random Clips</title>
    <script src="https://player.twitch.tv/js/embed/v1.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        #player { width: 100vw; height: 100vh; }
        #controls { position: absolute; bottom: 30px; right: 30px; z-index: 10; }
        button { background: #9146ff; border: none; color: white; padding: 12px 24px; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button:hover { background: #772ce8; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; }
    </style>
</head>
<body>

    <div id="loading">Loading Clips...</div>
    <div id="player"></div>
    <div id="controls" style="display:none;">
        <button onclick="playRandomClip()">Next Random Clip</button>
    </div>

    <script>
        let clips = [];
        let player = null;

        async function init() {
            try {
                const response = await fetch('/api/get-clips');
                const data = await response.json();
                clips = data.data;
                
                if (clips && clips.length > 0) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('controls').style.display = 'block';
                    playRandomClip();
                } else {
                    document.getElementById('loading').innerText = "No clips found.";
                }
            } catch (err) {
                document.getElementById('loading').innerText = "Error loading clips.";
            }
        }

        function playRandomClip() {
            const randomIndex = Math.floor(Math.random() * clips.length);
            const clip = clips[randomIndex];
            
            const playerDiv = document.getElementById('player');
            playerDiv.innerHTML = ''; 

            const options = {
                width: '100%',
                height: '100%',
                clip: clip.id,
                parent: [window.location.hostname],
                autoplay: true
            };
            
            player = new Twitch.Embed("player", options);
        }

        window.onload = init;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DTLdabs OBS Clip Shuffle</title>
    <script src="https://player.twitch.tv/js/embed/v1.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100vh; color: #fff; font-family: sans-serif; }
        #twitch-embed { width: 100vw; height: 100vh; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; 
                   background: #0e0e10; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .btn { background: #9146ff; border: none; color: white; padding: 20px 40px; border-radius: 5px; font-weight: bold; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="overlay" onclick="startShuffle()">
        <h1>DTLdabs Shuffle</h1>
        <p id="status">Syncing with Twitch...</p>
        <button class="btn" id="start-btn" style="display:none;">Click to Activate Audio & Start</button>
    </div>

    <div id="twitch-embed"></div>

    <script>
        let clips = [];
        let player = null;
        let timer = null;

        async function init() {
            try {
                const res = await fetch('/api/get-clips');
                const data = await res.json();
                if (data.data && data.data.length > 0) {
                    clips = data.data;
                    document.getElementById('status').innerText = clips.length + " clips synced.";
                    document.getElementById('start-btn').style.display = 'block';
                }
            } catch (err) { document.getElementById('status').innerText = "API Error."; }
        }

        function startShuffle() {
            // HACK: Play a silent sound to "unlock" the browser's audio context
            const silentAudio = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==");
            silentAudio.play().catch(() => {});

            document.getElementById('overlay').style.display = 'none';
            playNext();
        }

        function playNext() {
            if (clips.length === 0) return;
            if (timer) clearTimeout(timer);

            const clip = clips[Math.floor(Math.random() * clips.length)];
            const domain = window.location.hostname;

            // Clear previous player
            document.getElementById('twitch-embed').innerHTML = '';

            // Using the SDK constructor
            player = new Twitch.Embed("twitch-embed", {
                width: "100%",
                height: "100%",
                clip: clip.id,
                parent: [domain],
                autoplay: true,
                muted: false // Attempting full audio
            });

            // SDKs are safer for OBS. We set the timer based on clip duration.
            timer = setTimeout(playNext, (clip.duration * 1000) + 3000);
        }

        window.onload = init;
    </script>
</body>
</html>

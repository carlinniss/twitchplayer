<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DTLdabs Shuffle</title>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; }
        #player-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        iframe { width: 100%; height: 100%; border: none; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; background: #0e0e10; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn { background: #9146ff; border: none; color: white; padding: 25px 50px; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 24px; }
        #status { margin-bottom: 20px; opacity: 0.7; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>DTLdabs Shuffle</h1>
        <p id="status">Fetching clips...</p>
        <button id="start-btn" class="btn" style="display:none;" onclick="start()">START PLAYER</button>
    </div>

    <div id="player-container"></div>

    <script>
        let clips = [];
        let timer = null;

        async function init() {
            try {
                const res = await fetch('/api/get-clips');
                const data = await res.json();
                if (data.data && data.data.length > 0) {
                    clips = data.data;
                    document.getElementById('status').innerText = clips.length + " clips loaded.";
                    document.getElementById('start-btn').style.display = 'block';
                }
            } catch (err) { document.getElementById('status').innerText = "API Error."; }
        }

        function start() {
            document.getElementById('overlay').style.display = 'none';
            play();
        }

        function play() {
            if (clips.length === 0) return;
            if (timer) clearTimeout(timer);

            const clip = clips[Math.floor(Math.random() * clips.length)];
            const domain = window.location.hostname;
            const container = document.getElementById('player-container');

            // We MUST use muted=false here if you want sound.
            // If the browser blocks it, the video will start PAUSED.
            const url = `https://clips.twitch.tv/embed?clip=${clip.id}&parent=${domain}&autoplay=true&muted=false`;

            container.innerHTML = `<iframe src="${url}" allow="autoplay; fullscreen"></iframe>`;

            timer = setTimeout(play, (clip.duration * 1000) + 2500);
        }

        window.onload = init;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTLdabs Random Clips</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        /* Notice the 'allow' attribute below - that's the key */
        #clip-frame { width: 100vw; height: 100vh; border: none; position: absolute; top: 0; left: 0; z-index: 1; }
        #overlay { position: relative; z-index: 10; text-align: center; background: rgba(0,0,0,0.85); padding: 40px; border-radius: 12px; border: 1px solid #9146ff; }
        button { background: #9146ff; border: none; color: white; padding: 15px 30px; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 20px; }
        #next-btn { position: absolute; bottom: 30px; right: 30px; z-index: 100; display: none; background: rgba(145, 70, 255, 0.5); }
        #next-btn:hover { background: #9146ff; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>DTLdabs Clip Shuffle</h1>
        <p id="status">Fetching clips...</p>
        <button id="start-btn" style="display:none;" onclick="startPlayback()">Click to Start</button>
    </div>

    <iframe id="clip-frame" allow="autoplay; fullscreen" src=""></iframe>
    <button id="next-btn" onclick="playRandomClip()">Next Clip</button>

    <script>
        let clips = [];
        let nextClipTimer = null;

        async function init() {
            try {
                const response = await fetch('/api/get-clips');
                const data = await response.json();
                if (data.data && data.data.length > 0) {
                    clips = data.data;
                    document.getElementById('status').innerText = `Ready with ${clips.length} clips.`;
                    document.getElementById('start-btn').style.display = 'inline-block';
                }
            } catch (err) {
                document.getElementById('status').innerText = "API Error.";
            }
        }

        function startPlayback() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('next-btn').style.display = 'block';
            playRandomClip();
        }

        function playRandomClip() {
            if (clips.length === 0) return;
            if (nextClipTimer) clearTimeout(nextClipTimer);

            const clip = clips[Math.floor(Math.random() * clips.length)];
            const domain = window.location.hostname;
            
            // Try muted=false first. If it still doesn't play, change to muted=true
            const embedUrl = `https://clips.twitch.tv/embed?clip=${clip.id}&parent=${domain}&autoplay=true&muted=false`;
            
            document.getElementById('clip-frame').src = embedUrl;

            // Auto-advance logic
            const durationMs = (clip.duration * 1000) + 2000;
            nextClipTimer = setTimeout(playRandomClip, durationMs);
        }

        window.onload = init;
    </script>
</body>
</html>

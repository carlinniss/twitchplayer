<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTLdabs Clip Shuffle</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #player-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        iframe { width: 100%; height: 100%; border: none; }
        #overlay { position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 100%; background: #0e0e10; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        button { background: #9146ff; border: none; color: white; padding: 20px 40px; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 24px; transition: 0.2s; }
        button:hover { background: #772ce8; transform: scale(1.05); }
        #next-btn { position: absolute; bottom: 30px; right: 30px; z-index: 50; padding: 12px 24px; opacity: 0.5; background: #9146ff; color: white; border: none; border-radius: 4px; cursor: pointer; display: none; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>DTLdabs Shuffle</h1>
        <p id="status">Syncing clips...</p>
        <button id="start-btn" style="display:none;" onclick="start()">START SHUFFLE</button>
    </div>

    <div id="player-container"></div>
    <button id="next-btn" onclick="play()">Next Clip</button>

    <script>
        let clips = [];
        let timer = null;

        async function init() {
            try {
                const response = await fetch('/api/get-clips');
                const data = await response.json();
                if (data.data && data.data.length > 0) {
                    clips = data.data;
                    document.getElementById('status').innerText = clips.length + " clips ready.";
                    document.getElementById('start-btn').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('status').innerText = "API Error. Check Vercel logs.";
            }
        }

        function start() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('next-btn').style.display = 'block';
            play();
        }

        function play() {
            if (clips.length === 0) return;
            if (timer) clearTimeout(timer);

            const clip = clips[Math.floor(Math.random() * clips.length)];
            const container = document.getElementById('player-container');
            
            // Vercel fix: Use location.hostname for the parent parameter.
            // If the Vercel 'Visit' button opens with the Vercel Toolbar, 
            // try opening the URL directly in a new tab to avoid frame nesting.
            const parent = window.location.hostname;
            
            const url = `https://clips.twitch.tv/embed?clip=${clip.id}&parent=${parent}&autoplay=true&muted=true`;

            container.innerHTML = `
                <iframe 
                    src="${url}" 
                    allow="autoplay; fullscreen" 
                    preload="auto">
                </iframe>
            `;

            // Auto-advance logic based on clip duration
            timer = setTimeout(play, (clip.duration * 1000) + 2000);
        }

        window.onload = init;
    </script>
</body>
</html>

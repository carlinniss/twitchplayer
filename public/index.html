<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTLdabs Random Clips</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #clip-frame { width: 100vw; height: 100vh; border: none; position: absolute; top: 0; left: 0; z-index: 1; }
        #overlay { position: relative; z-index: 10; text-align: center; background: rgba(0,0,0,0.85); padding: 40px; border-radius: 12px; border: 1px solid #9146ff; }
        button { background: #9146ff; border: none; color: white; padding: 15px 30px; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button:hover { background: #772ce8; }
        #next-btn { position: absolute; bottom: 30px; right: 30px; z-index: 100; display: none; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>DTLdabs Clip Shuffle</h1>
        <p id="status">Fetching clips from Vercel...</p>
        <button id="start-btn" style="display:none;" onclick="startPlayback()">Click to Start</button>
    </div>

    <iframe id="clip-frame" allowfullscreen="true" preload="auto"></iframe>
    <button id="next-btn" onclick="playRandomClip()">Next Random Clip</button>

    <script>
        let clips = [];

        async function init() {
            try {
                const response = await fetch('/api/get-clips');
                const data = await response.json();
                
                if (data.data && data.data.length > 0) {
                    clips = data.data;
                    document.getElementById('status').innerText = `Loaded ${clips.length} clips!`;
                    document.getElementById('start-btn').style.display = 'inline-block';
                } else {
                    document.getElementById('status').innerText = "No clips found.";
                }
            } catch (err) {
                document.getElementById('status').innerText = "Error connecting to API.";
            }
        }

        function startPlayback() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('next-btn').style.display = 'block';
            playRandomClip();
        }

        function playRandomClip() {
            if (clips.length === 0) return;

            const randomIndex = Math.floor(Math.random() * clips.length);
            const clip = clips[randomIndex];
            
            // Twitch requires the 'parent' domain for the iframe to work.
            // window.location.hostname works for both localhost and Vercel domains.
            const domain = window.location.hostname;
            const embedUrl = `https://clips.twitch.tv/embed?clip=${clip.id}&parent=${domain}&autoplay=true&muted=false`;
            
            const frame = document.getElementById('clip-frame');
            frame.src = embedUrl;
        }

        window.onload = init;
    </script>
</body>
</html>

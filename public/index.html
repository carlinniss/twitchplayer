<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DTLdabs Direct Shuffle</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100vh; font-family: sans-serif; }
        #video-player { width: 100vw; height: 100vh; object-fit: contain; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; 
                   background: #0e0e10; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .btn { background: #9146ff; border: none; color: white; padding: 20px 40px; border-radius: 5px; font-weight: bold; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="overlay" onclick="startShuffle()">
        <h1>DTLdabs Shuffle</h1>
        <p id="status">Converting clip assets...</p>
        <button class="btn" id="start-btn" style="display:none;">START PLAYER</button>
    </div>

    <video id="video-player" playsinline></video>

    <script>
        let clips = [];
        const player = document.getElementById('video-player');

        async function init() {
            try {
                const res = await fetch('/api/get-clips');
                const data = await res.json();
                if (data.data && data.data.length > 0) {
                    clips = data.data;
                    document.getElementById('status').innerText = clips.length + " clips ready.";
                    document.getElementById('start-btn').style.display = 'block';
                }
            } catch (err) { document.getElementById('status').innerText = "API Error."; }
        }

        function startShuffle() {
            document.getElementById('overlay').style.display = 'none';
            playNext();
        }

        function playNext() {
            if (clips.length === 0) return;

            const clip = clips[Math.floor(Math.random() * clips.length)];
            
            // THE TRICK: Transform thumbnail URL into direct MP4 URL
            // From: ...-preview-480x272.jpg  To: ... .mp4
            let videoUrl = clip.thumbnail_url.split("-preview-")[0] + ".mp4";

            console.log("Playing direct video:", videoUrl);
            
            player.src = videoUrl;
            player.load();
            
            // Because of the 'Start' click, this will play with sound 100% of the time
            player.play().catch(e => {
                console.log("Autoplay blocked, trying muted...");
                player.muted = true;
                player.play();
            });
        }

        // Perfect transition: Play the next clip as soon as this one ends
        player.onended = () => {
            console.log("Clip ended, moving to next...");
            playNext();
        };

        window.onload = init;
    </script>
</body>
</html>

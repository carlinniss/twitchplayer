<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTLdabs Shuffle</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; }
        #player-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        iframe { width: 100%; height: 100%; border: none; }
        #next-btn { position: absolute; bottom: 20px; right: 20px; z-index: 101; opacity: 0.1; background: #9146ff; color: white; border: none; border-radius: 4px; padding: 10px 20px; cursor: pointer; transition: opacity 0.3s; }
        #next-btn:hover { opacity: 1; }
        #init-msg { position: fixed; top: 10px; left: 10px; color: #333; font-size: 10px; z-index: 100; }
    </style>
</head>
<body>

    <div id="init-msg">Connecting...</div>
    <div id="player-container"></div>
    <button id="next-btn" onclick="playRandomClip()">Next Clip</button>

    <script>
        let clips = [];
        let playlist = [];
        let nextClipTimer = null;
        let isActivated = true; // Set to true to attempt immediate autoplay

        async function init() {
            try {
                const response = await fetch('/api/get-clips');
                const data = await response.json();
                if (data.data && data.data.length > 0) {
                    clips = data.data;
                    document.getElementById('init-msg').style.display = 'none';
                    playRandomClip();
                }
            } catch (err) {
                document.getElementById('init-msg').innerText = "API Error";
            }
        }

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function playRandomClip() {
            if (clips.length === 0) return;
            if (nextClipTimer) clearTimeout(nextClipTimer);

            if (playlist.length === 0) {
                playlist = shuffle([...clips]);
            }

            const clip = playlist.pop();
            const domain = window.location.hostname || "localhost";
            const container = document.getElementById('player-container');

            // We attempt unmuted autoplay. 
            // Note: This will only succeed if the OBS 'Interact' window has been clicked once.
            const url = `https://clips.twitch.tv/embed?clip=${clip.id}&parent=${domain}&autoplay=true&muted=false`;

            container.innerHTML = `
                <iframe 
                    src="${url}" 
                    allow="autoplay; fullscreen" 
                    preload="auto">
                </iframe>
            `;

            const durationMs = (clip.duration * 1000) + 2500;
            nextClipTimer = setTimeout(playRandomClip, durationMs);
        }

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                if (nextClipTimer) clearTimeout(nextClipTimer);
                document.getElementById('player-container').innerHTML = '';
            } else {
                playRandomClip();
            }
        });

        window.onload = init;
    </script>
</body>
</html>

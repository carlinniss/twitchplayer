<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTLdabs Random Clips</title>
    <script src="https://player.twitch.tv/js/embed/v1.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #player { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #overlay { position: relative; z-index: 10; text-align: center; background: rgba(0,0,0,0.8); padding: 40px; border-radius: 12px; border: 1px solid #9146ff; }
        button { background: #9146ff; border: none; color: white; padding: 15px 30px; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 20px; transition: transform 0.2s; }
        button:hover { background: #772ce8; transform: scale(1.05); }
        #next-btn { position: absolute; bottom: 30px; right: 30px; z-index: 100; display: none; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>DTLdabs Clip Shuffle</h1>
        <p id="status">Fetching clips...</p>
        <button id="start-btn" style="display:none;" onclick="startPlayback()">Click to Start</button>
    </div>

    <div id="player"></div>
    <button id="next-btn" onclick="playRandomClip()">Next Clip</button>

    <script>
        let clips = [];
        let player = null;

        async function init() {
            try {
                console.log("Fetching from /api/get-clips...");
                const response = await fetch('/api/get-clips');
                const data = await response.json();
                
                if (data.data && data.data.length > 0) {
                    clips = data.data;
                    document.getElementById('status').innerText = `Loaded ${clips.length} clips!`;
                    document.getElementById('start-btn').style.display = 'inline-block';
                } else {
                    document.getElementById('status').innerText = "No clips found for DTLdabs.";
                }
            } catch (err) {
                console.error("Fetch error:", err);
                document.getElementById('status').innerText = "API Error. Check Vercel Logs.";
            }
        }

        function startPlayback() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('next-btn').style.display = 'block';
            playRandomClip();
        }

        function playRandomClip() {
            if (clips.length === 0) return;

            const randomIndex = Math.floor(Math.random() * clips.length);
            const clip = clips[randomIndex];
            console.log("Playing clip:", clip.id);
            
            // Clear current player
            document.getElementById('player').innerHTML = ''; 

            const options = {
                width: '100%',
                height: '100%',
                clip: clip.id,
                // Twitch needs to know exactly where the embed is hosted
                parent: [window.location.hostname],
                autoplay: true,
                muted: false
            };
            
            // Check if Twitch SDK loaded
            if (typeof Twitch !== 'undefined') {
                player = new Twitch.Embed("player", options);
            } else {
                alert("Twitch SDK failed to load. Check your internet connection or ad-blocker.");
            }
        }

        window.onload = init;
    </script>
</body>
</html>

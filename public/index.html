<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTLdabs Shuffle</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; }
        #player-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        iframe { width: 100%; height: 100%; border: none; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; background: #0e0e10; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; }
        .btn { background: #9146ff; border: none; color: white; padding: 25px 50px; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 24px; transition: transform 0.2s; }
        .btn:hover { background: #772ce8; transform: scale(1.05); }
        #status { margin-bottom: 20px; opacity: 0.7; font-size: 18px; }
        #next-btn { position: absolute; bottom: 20px; right: 20px; z-index: 101; opacity: 0.4; background: #9146ff; color: white; border: none; border-radius: 4px; padding: 10px 20px; cursor: pointer; }
        #next-btn:hover { opacity: 1; }
    </style>
</head>
<body>

    <div id="overlay" onclick="startPlayback()">
        <h1>DTLdabs Shuffle</h1>
        <p id="status">Syncing clips...</p>
        <button id="start-btn" class="btn" style="display:none;">START PLAYER</button>
    </div>

    <div id="player-container"></div>
    <button id="next-btn" style="display:none;" onclick="playRandomClip()">Next Clip</button>

    <script>
        let clips = [];
        let nextClipTimer = null;
        let isActivated = false;

        async function init() {
            try {
                const response = await fetch('/api/get-clips');
                const data = await response.json();
                if (data.data && data.data.length > 0) {
                    clips = data.data;
                    document.getElementById('status').innerText = clips.length + " clips synced.";
                    document.getElementById('start-btn').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('status').innerText = "Vercel API connection failed.";
            }
        }

        function startPlayback() {
            isActivated = true;
            
            // EDGE CASE FIX: Play a silent sound on the top-level page 
            // to "warm up" the browser's audio context before loading the iframe.
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            gainNode.gain.value = 0.0001; 
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start(0);
            oscillator.stop(0.1);

            document.getElementById('overlay').style.display = 'none';
            document.getElementById('next-btn').style.display = 'block';
            playRandomClip();
        }

        function playRandomClip() {
            if (clips.length === 0 || !isActivated) return;
            if (nextClipTimer) clearTimeout(nextClipTimer);

            const clip = clips[Math.floor(Math.random() * clips.length)];
            
            // EDGE CASE FIX: Explicitly handle the Vercel 'parent' parameter.
            // If hostname is empty (e.g. local file), fallback to localhost.
            const domain = window.location.hostname || "localhost";
            const container = document.getElementById('player-container');

            // EDGE CASE FIX: Use muted=false but ensure 'autoplay=true'.
            // Because we triggered this via a click (startPlayback), 
            // the browser passes the "User Activation" to the iframe.
            const url = `https://clips.twitch.tv/embed?clip=${clip.id}&parent=${domain}&autoplay=true&muted=false`;

            // EDGE CASE FIX: Re-inserting the iframe completely ensures 
            // that each new clip treats the 'autoplay' attribute as a fresh instruction.
            container.innerHTML = `
                <iframe 
                    src="${url}" 
                    allow="autoplay; fullscreen" 
                    preload="auto">
                </iframe>
            `;

            const durationMs = (clip.duration * 1000) + 2500;
            nextClipTimer = setTimeout(playRandomClip, durationMs);
        }

        // EDGE CASE FIX: Handle OBS Scene Switching without breaking future autoplay.
        // We clear the iframe to stop audio, then re-trigger play when the scene returns.
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                if (nextClipTimer) clearTimeout(nextClipTimer);
                document.getElementById('player-container').innerHTML = '';
            } else if (isActivated) {
                playRandomClip();
            }
        });

        window.onload = init;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DTLdabs OBS Shuffle</title>
    <style>
        body { margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100vh; }
        #player-container { width: 100vw; height: 100vh; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="player-container"></div>

    <script>
        let clips = [];
        let timer = null;

        async function init() {
            try {
                const response = await fetch('/api/get-clips');
                const data = await response.json();
                if (data.data && data.data.length > 0) {
                    clips = data.data;
                    play();
                }
            } catch (err) { console.error("API Error"); }
        }

        function play() {
            if (clips.length === 0) return;
            if (timer) clearTimeout(timer);

            const clip = clips[Math.floor(Math.random() * clips.length)];
            const container = document.getElementById('player-container');
            
            // Critical: If your Vercel URL is 'dtldabs.vercel.app', 
            // the parent must be 'dtldabs.vercel.app'
            const parent = window.location.hostname;
            
            const url = `https://clips.twitch.tv/embed?clip=${clip.id}&parent=${parent}&autoplay=true&muted=true`;

            container.innerHTML = `<iframe src="${url}" allow="autoplay; fullscreen"></iframe>`;

            // Duration + buffer
            timer = setTimeout(play, (clip.duration * 1000) + 2500);
        }

        window.onload = init;
    </script>
</body>
</html>
